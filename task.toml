[task]
name = "wal-replay-repair"
author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "database_engineering"
tags = ["wal-replay", "crash-recovery", "transaction-log", "page-reconstruction", "debugging"]

[task.difficulty]
level = "hard"
expert_time_estimate_hours = 4.0
num_bugs = 5
description = "WAL replay engine with 5 interacting bugs across transaction tracking, page reconstruction, and checkpoint boundary handling"

[task.runtime]
dockerfile = "environment/Dockerfile"
entry_point = "python3 -m runtime.run_recovery"
working_dir = "/app"

[task.validator]
test_script = "tests/test.sh"
test_file = "tests/test_recovery.py"
total_tests = 15
pass_threshold = 15

[task.repair]
solution_script = "solution/solve.sh"
repair_module = "solution/repair_recovery.py"
files_to_fix = [
    "runtime/txn_tracker.py",
    "runtime/page_reconstructor.py",
    "runtime/checkpoint_handler.py",
]

[task.resources]
instruction = "instruction.md"
wal_segments = [
    "environment/runtime/wal_segment_001.jsonl",
    "environment/runtime/wal_segment_002.jsonl",
    "environment/runtime/wal_segment_003.jsonl",
]
config = "environment/runtime/recovery.ini"
