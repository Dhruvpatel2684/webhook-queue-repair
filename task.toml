difficulty_explanation = "Four interacting bugs across config parsing, section references, accumulation logic, and sort ordering require tracing data flow through ingester, classifier, throttler, and reporter modules."
solution_explanation = "The repair script fixes: (1) strip whitespace in tier parsing, (2) read bucket_capacity from correct config section, (3) use assignment instead of accumulation for token counts, (4) add service_tier to sort key."
verification_explanation = "10 tests in 3 difficulty tiers: easy (4 pass with buggy code), medium (3 require 1-2 fixes), hard (3 require 3-4 fixes). Reward requires all 10 tests to pass."
expert_time_estimate_hours = 2.5

[task]
name = "ratelimit-engine-repair"
description = "Debug a multi-tenant rate limiting engine with four interacting bugs in config parsing, token bucket capacity, consumption tracking, and throttle ordering."

[task.difficulty]
level = "hard"
reasoning = "Four bugs across config parsing, section references, accumulation, and sort stability require understanding rate limiting semantics and tracing configuration flow across six modules."

[task.runtime]
entrypoint = "python3 -m runtime.run_limiter"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the rate limiter then validates output with pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Applies four patches and re-runs the engine."

