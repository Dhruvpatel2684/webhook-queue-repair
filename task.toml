category = "network_protocol_engineering"
difficulty = "hard"
tags = ["packet-reassembly", "network-fragments", "flow-tracking", "checksum-validation", "debugging"]

difficulty_explanation = "Five interacting bugs across 4 files: string sequence comparison only fails for flows with 10+ fragments, checksum byte order reversal with misleading network-byte-order comment, retransmission overlap handling that looks like dedup but isn't, config section mismatch for flow timeout, and completeness threshold that interacts with overlap handling. Bugs compound: wrong flow grouping means wrong fragment counts, wrong ordering means wrong reassembly, wrong overlap handling inflates byte counts which triggers wrong completeness."
solution_explanation = "Fix int() cast for seq_num sort, remove payload reversal in checksum, change overlap handling from skip-duplicates to keep-latest, read max_gap_ms from flows.calibrated section, change >= to == for completeness check."
verification_explanation = "15 tests: 7 structural pass with bugs, 3 need flow grouping + ordering fixed, 3 need checksum + overlap + completeness fixed, 2 need all 5 for correct digest and combined assertion."
expert_time_estimate_hours = 4.0

[task]
name = "packet-reassembly-repair"
description = "Debug a packet fragment reassembly engine with interacting bugs in sequence ordering, checksum validation, retransmission handling, flow timeout configuration, and completeness detection."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding packet reassembly semantics, recognizing that string sorting only fails above 9 fragments, identifying that a misleading byte-order comment describes wrong behavior, and tracing how overlap handling interacts with completeness thresholds."

[task.runtime]
entrypoint = "python3 -m runtime.run_reassembly"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Pytest suite validating reassembled packet state."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches fragment_sorter.py, checksum_validator.py, reassembler.py, and flow_grouper.py then re-runs."

