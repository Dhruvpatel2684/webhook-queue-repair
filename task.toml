author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "distributed_systems"
difficulty = "hard"
tags = ["crdt", "merge-engine", "conflict-resolution", "distributed-state", "debugging"]

difficulty_explanation = "Five interacting bugs across 3 files: string vs int timestamp comparison that only fails on specific boundary values, OR-set remove matching by wrong field, OR-set deduplication using value instead of element_id, config section mismatch for tie-breaking, and off-by-one in conflict threshold. Bugs interact because register values feed into conflict detection, and set contents depend on both add dedup and remove matching being correct."
solution_explanation = "Fix int() cast for timestamp comparison, change remove matching from element_id to value field, change dedup key from value to element_id, read replica_priority from merge.priorities section, change >= to > for conflict threshold."
verification_explanation = "15 tests in 4 tiers: 7 structural tests pass with bugs, 3 register tests need fixes 1+4, 3 set/conflict tests need fixes 2+3+5, 2 combined tests need all 5 bugs fixed for correct digest and combined assertions."
expert_time_estimate_hours = 4.0

[task]
name = "crdt-merge-repair"
description = "Debug a CRDT merge engine that produces incorrect merged state due to interacting bugs in timestamp comparison, set element matching, deduplication logic, config-based tie-breaking, and conflict threshold calculation."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding CRDT semantics (LWW registers, OR-sets), tracing data flow across multiple modules, identifying subtle type coercion issues, and recognizing that a misleading code comment describes incorrect behavior."

[task.runtime]
entrypoint = "python3 -m runtime.run_merge"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash /tests/test.sh"
description = "Pytest suite validating merged CRDT state output."

[task.repair]
command = "bash /solution/solve.sh"
description = "Patches lww_register.py, orset_merger.py, and conflict_detector.py then re-runs."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
