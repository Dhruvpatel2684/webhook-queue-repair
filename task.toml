difficulty_explanation = "Requires understanding regex compilation, NFA evaluation, and tracing data flow across loader, compiler, and evaluator modules. Four bugs interact: category filtering affects pattern loading, backtrack limits affect match accuracy, count accumulation inflates results, and sort order affects determinism."
solution_explanation = "The repair script fixes: (1) strip whitespace in category parsing, (2) read backtrack limit from correct config section, (3) use assignment instead of accumulation for match counts, (4) add category to sort key for deterministic ordering."
