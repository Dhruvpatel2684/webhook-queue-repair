author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "spatial_indexing"
difficulty = "hard"
tags = ["geospatial", "sensor-correlation", "time-windows", "config-parsing", "debugging"]

difficulty_explanation = "Four interacting bugs across configuration parsing, zone filtering, window aggregation, and sort ordering. Bug A silently drops a zone due to whitespace in config parsing. Bug B reads the wrong config section for thresholds. Bug C accumulates window values when only the last snapshot should be used. Bug D uses sensor_id instead of zone_id for sort tiebreaking at equal timestamps, causing zone_a/zone_b assignment errors. The report digest couples all four bugs, requiring all fixes to be correct simultaneously."
solution_explanation = "The repair script fixes: (1) strip whitespace when splitting active_zones config value, (2) read correlation_threshold from the correlation.tuned section instead of correlation, (3) use last-write-wins instead of accumulation in zone aggregation, (4) sort by zone_id instead of sensor_id as tiebreaker for same-timestamp readings."
verification_explanation = "14 tests across 4 tiers: basic structure tests pass with buggy code, medium tests require fixing zone filtering (Bug A), hard tests require fixing threshold and aggregation (Bugs B+C), and hardest tests require all four bugs fixed for correct digest and sort ordering."
expert_time_estimate_hours = 3.0

[task]
name = "spatial-index-repair"
description = "Debug a geospatial sensor correlation engine that produces incorrect cross-zone correlation reports due to interacting bugs in config parsing, zone filtering, time-window aggregation, and sort key ordering."

[task.difficulty]
level = "hard"
reasoning = "Requires tracing data flow across multiple modules, understanding config section semantics, recognizing whitespace parsing issues, and identifying subtle sort-order dependencies that only manifest with same-timestamp readings from different sources."

[task.runtime]
entrypoint = "python3 -m runtime.run_correlation"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs pytest suite validating correlation output structure, zone counts, correlation counts, aggregation values, sort ordering, and report digest integrity."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches correlation_engine.py, zone_aggregator.py config parsing and aggregation logic, then re-runs the engine to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
