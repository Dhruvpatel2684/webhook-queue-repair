author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "task_scheduling"
difficulty = "hard"
tags = ["job-scheduler", "priority-queue", "resource-allocation", "config-parsing", "debugging"]

difficulty_explanation = "Four interacting bugs across configuration parsing, pool filtering, round aggregation, and sort ordering. Bug A silently drops a resource pool due to whitespace in config parsing and appears in two separate files. Bug B reads the wrong config section for concurrency limits. Bug C accumulates round values when only the last snapshot should be used. Bug D uses job_id instead of queue_name for sort tiebreaking at equal priority/timestamp, causing scheduling order errors. The report digest couples all four bugs."
solution_explanation = "The repair script fixes: (1) strip whitespace when splitting resource_pools config value in both files, (2) read max_concurrent from the scheduler.production section instead of scheduler, (3) use last-write-wins instead of accumulation in pool aggregation, (4) sort by queue_name instead of job_id as tiebreaker for same-priority same-timestamp jobs."
verification_explanation = "15 tests across 4 tiers: basic structure tests (7) pass with buggy code, medium tests (3) require fixing pool filtering, hard tests (3) require fixing concurrency and aggregation, and hardest tests (2) require all four bugs fixed for correct digest and sort ordering."
expert_time_estimate_hours = 3.0

[task]
name = "cgroup-scheduler-repair"
description = "Debug a priority-based job scheduler that produces incorrect execution plans due to interacting bugs in config parsing, resource pool filtering, round-based aggregation, and priority sort key ordering."

[task.difficulty]
level = "hard"
reasoning = "Requires tracing data flow across multiple modules, understanding config section semantics, recognizing whitespace parsing issues in two files, and identifying subtle sort-order dependencies that only manifest with same-priority same-timestamp jobs from different queues."

[task.runtime]
entrypoint = "python3 -m runtime.run_scheduler"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs pytest suite validating schedule output structure, pool counts, round counts, aggregation values, sort ordering, and schedule digest integrity."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches priority_scheduler.py and round_aggregator.py config parsing and aggregation logic, then re-runs the scheduler to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
