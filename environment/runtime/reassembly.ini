[capture]
# Source capture files to load
sources = captures_stream_a.jsonl,captures_stream_b.jsonl,captures_stream_c.jsonl

[flows]
# Initial flow grouping parameters
max_gap_ms = 5000
min_fragments = 2

[flows.calibrated]
# Calibrated after testing with real captures
max_gap_ms = 1000
min_fragments = 2

[checksum]
# Integrity validation settings
algorithm = xor
fail_action = flag

[reassembly]
# Reassembly behavior
overlap_strategy = latest
completeness_mode = exact
