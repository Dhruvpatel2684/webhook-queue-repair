[merge]
strategy = lww
# Replica ordering for display and legacy fallback
replica_priority = gamma,alpha,beta

[merge.priorities]
# Calibrated priority order from consistency testing
replica_priority = alpha,beta,gamma

[sets]
# Element matching semantics
match_field = value
dedup_field = element_id

[conflicts]
# Entries with write count exceeding this are high-conflict
conflict_threshold = 2
