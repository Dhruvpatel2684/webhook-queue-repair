[scheduler]
# Resource pools eligible for job assignment
# Jobs targeting pools not in this list are rejected
resource_pools = pool_compute,pool_memory,pool_gpu, pool_network

# Maximum concurrent jobs per scheduling round
max_concurrent = 20

# Priority weight multiplier for aging jobs
aging_factor = 1.5

[scheduler.production]
# Production-tuned concurrency limit after load testing
# This section was calibrated against real traffic patterns
max_concurrent = 8

[queues]
default_priority = 5
max_queue_depth = 100
