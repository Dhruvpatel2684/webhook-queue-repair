[gc]
# Base GC parameters from initial deployment configuration
# These represent theoretical maximums based on page size alignment
bytes_per_version = 256
max_versions_per_key = 100
gc_batch_size = 50

[gc.measured]
# Measured values from production profiling (Q4 analysis)
# These reflect actual observed averages after compaction
bytes_per_version = 112
max_versions_per_key = 20
gc_batch_size = 50

[snapshots]
# Snapshot management configuration
include_active = true
watermark_mode = conservative

[storage]
# Storage engine parameters
page_size = 4096
compaction_threshold = 0.7
write_buffer_mb = 64
