[passes]
# Categories of optimization passes eligible for scheduling
active_categories = transform,analysis, lowering,cleanup

# Maximum passes per scheduling phase
phase_capacity = 25

# Dependency chain depth limit before marking as blocked
max_chain_depth = 4

[passes.optimized]
# Tuned capacity after profiling real workloads
phase_capacity = 6

[resolver]
# When passes share priority and submission order,
# break ties using the originating module for stable output
tie_strategy = module_first
