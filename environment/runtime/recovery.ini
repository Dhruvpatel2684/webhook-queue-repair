[recovery]
# Legacy recovery parameters
recovery_mode = undo
checkpoint_interval = 100

[recovery.active]
# Current active recovery configuration
recovery_mode = redo
max_replay_lsn = 1200

[output]
output_dir = output
recovered_state_file = recovered_state.json
recovery_report_file = recovery_report.json

[segments]
segment_pattern = wal_segment_*.jsonl
segment_dir = .
