[correlation]
# Zones to include in final correlation output
# Only readings from these zones are eligible for cross-zone correlation
active_zones = zone_alpha,zone_beta,zone_gamma, zone_delta

# Maximum time gap (seconds) between readings to consider them correlated
max_time_gap = 30

# Minimum correlation strength threshold
correlation_threshold = 75

[correlation.tuned]
# Production-tuned threshold after calibration runs (use this for scoring)
correlation_threshold = 40

[output]
format = json
include_metadata = true
