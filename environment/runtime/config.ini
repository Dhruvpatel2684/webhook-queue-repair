[limiter]
service_tiers = basic,standard,premium, enterprise
bucket_capacity = 1000
refill_rate = 10
window_duration = 60
evaluation_mode = strict

[limiter.tokens]
bucket_capacity = 100
max_windows = 30
burst_allowance = 1.5

[limiter.logging]
level = INFO
format = structured
include_metrics = true
